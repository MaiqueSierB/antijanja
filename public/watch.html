<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Anti Janja · Assistir</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3476040476227672"
     crossorigin="anonymous"></script>
</head>
<body class="bg-dark text-light">
  <main class="container py-4 py-lg-5">
    <header class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-broadcast-pin fs-3 text-primary"></i>
        <span class="fw-bold fs-5">ANTI JANJA</span>
      </div>
      <span class="badge text-bg-success rounded-pill px-3 py-2">SALA DE TRANSMISSÃO</span>
    </header>

    <section class="card bg-body-tertiary text-light border-secondary shadow-lg">
      <div class="card-body p-3 p-md-4 p-lg-5">
        <p class="text-primary fw-bold small text-uppercase mb-2">Assistir ao vivo</p>
        <h1 class="h2 fw-bold mb-2">Transmissão compartilhada</h1>
        <p class="text-secondary mb-4">Aguarde o transmissor iniciar ou reconectar.</p>

        <div class="ratio ratio-16x9 bg-black rounded overflow-hidden border border-secondary">
          <video id="video" autoplay playsinline controls class="w-100 h-100"></video>
          <div id="placeholder" class="position-absolute top-50 start-50 translate-middle text-center text-secondary">
            <i class="bi bi-hourglass-split fs-1 d-block mb-2"></i>
            Aguardando transmissão...
          </div>
        </div>

        <div id="status" class="alert alert-secondary mt-3 mb-0" role="status">Conectando à sala...</div>
        <button id="sound" class="btn btn-primary mt-3" hidden>
          <i class="bi bi-play-fill me-1"></i> Ativar áudio / iniciar vídeo
        </button>
      </div>
    </section>
    <footer class="text-center text-secondary small mt-4">Se o vídeo não iniciar, atualize a página e verifique sua conexão.</footer>
  </main>
  <script defer src="/socket.io/socket.io.js"></script>
  <script defer src="/watch.js"></script>
</body>
</html>
