<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
  <title>Anti Janja · Transmissões</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light min-vh-100 d-flex align-items-center">
  <main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-lg-7">
    <div class="card bg-body-tertiary border-secondary shadow-lg"><div class="card-body p-4 p-lg-5 text-center">
      <i class="bi bi-broadcast-pin display-3 text-primary"></i>
      <h1 class="display-6 fw-bold mt-3">ANTI JANJA</h1>
      <p class="lead text-secondary">Salas de transmissão de tela em tempo real.</p>
      <div class="alert alert-info text-start mt-4"><i class="bi bi-info-circle me-2"></i>Para entrar em uma sala, abra o link compartilhado pelo criador no Discord. Cada pessoa na sala pode assistir e iniciar sua própria transmissão.</div>
      <p class="text-secondary small mb-0">Para criar uma sala, use o comando <code>/transmitir</code> no servidor Discord configurado.</p>
    </div></div>
  </div></div></main>
</body>
</html>
